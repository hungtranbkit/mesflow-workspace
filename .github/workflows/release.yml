name: Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Project code to release (e.g. mesflow-app)"
        required: true
        type: string

# Deliberately manual/single-project only -- never builds the whole
# workspace as one artifact (docs/CI_CD_STANDARD.md section 12). Builds
# once, computes an immutable SHA256 manifest, and stops: there is no
# generic, workspace-level deployment runtime yet, so PRODUCTION promotion
# stays BLOCKED_BY_DEPLOY_RUNTIME (section 10) rather than being faked
# here with an ad hoc deploy step.

jobs:
  build:
    name: Build once + manifest (${{ inputs.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Required CI gates must pass before building a release
        run: python3 scripts/ci/run_project.py "${{ inputs.project }}"

      - name: Build once
        run: python3 scripts/ci/run_project.py "${{ inputs.project }}" --stage build

      - name: Locate artifact
        id: artifact
        run: echo "path=$(python3 scripts/ci/locate_artifact.py "${{ inputs.project }}")" >> "$GITHUB_OUTPUT"

      - name: Write immutable release manifest (SHA256)
        run: |
          python3 scripts/ci/release_manifest.py "${{ inputs.project }}" "${{ steps.artifact.outputs.path }}" \
            --builder github-actions --out "manifest-${{ inputs.project }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ inputs.project }}
          path: manifest-${{ inputs.project }}.json

      - name: Production CD status
        run: |
          echo "TEST qualification: reuses this project's own deployment.test.enabled contract."
          echo "PRODUCTION_CD: BLOCKED_BY_DEPLOY_RUNTIME -- no generic workspace deployment runtime exists yet."
          echo "Promotion, if any, is a separate, human-approved action outside this workflow (see AGENTS.md, docs/CI_CD_STANDARD.md section 10)."
