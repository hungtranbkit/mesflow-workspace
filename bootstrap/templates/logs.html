{% extends "base.html" %}
{% block title %}Logs — MESFlow Bootstrap{% endblock %}
{% block content %}
<h1>Logs</h1>
<div class="card">
  <h2>Bootstrap application log (last 300 lines)</h2>
  <pre class="log-output">{{ app_log or '(empty)' }}</pre>
</div>
<div class="card">
  <h2>Audit log (last 300 lines)</h2>
  <pre class="log-output">{{ audit_log or '(empty)' }}</pre>
</div>
{% endblock %}
