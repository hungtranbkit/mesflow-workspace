name: _project-ci (reusable)

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string

jobs:
  run:
    name: ${{ inputs.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Run required CI gates for ${{ inputs.project }}
        run: python3 scripts/ci/run_project.py "${{ inputs.project }}"

      - name: Upload JUnit/test-results if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.project }}-test-results
          path: |
            */test-results/*.xml
            test-results/*.xml
          if-no-files-found: ignore
